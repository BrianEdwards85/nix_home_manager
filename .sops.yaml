# Who can decrypt what. Edit a secret with `sops secrets/<host>.yaml` (needs the YubiKey).
# After changing a key list: sops updatekeys secrets/<host>.yaml
keys:
  # Admin: the GPG key on the YubiKey (conf/gpg-pubkey.asc).
  - &admin 7B552AE820934E96D3BFA24C27E847F6C471A897
  - &admin429F 429F3D404441DEA2F0815E829B2ED43C9EA698EE
  # A server's age key is its SSH host key:
  #   ssh-keyscan -t ed25519 <host> | ssh-to-age
  - &wintermute age1rxa4980zu4xp2scw4r52hpy6k5cmu3zsm92nu0ft2xe0medzg4rq3fj08x
creation_rules:
  - path_regex: secrets/wintermute\.yaml$
    key_groups:
      - pgp: [*admin, *admin429F]
        age: [*wintermute]

# The print server (modules/nixos/print-tls.nix) keeps two secrets in secrets/print.yaml, which it decrypts with its SSH host key. Fill in after its first
# deploy, then uncomment the key and the rule, and run `sops secrets/print.yaml`:
#   ssh-keyscan -t ed25519 print.free-side.us | ssh-to-age
#   - &print age1...
# and under creation_rules:
#   - path_regex: secrets/print\.yaml$
